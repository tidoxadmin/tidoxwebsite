<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <!--
    Private Flashcards FREE - Store Listing Icon
    Composites background + foreground from Android adaptive icon vectors.
    viewBox="0 0 108 108" matches the Android 108dp canvas.
    Uses Google Play's official squircle mask shape.
  -->
  <defs>
    <!-- Google Play Store squircle mask (superellipse, properly shaped) -->
    <clipPath id="squircle">
      <path d="
        M 54,1
        C 75,1 88,1 94,7
        C 100,13 107,26 107,54
        C 107,82 100,95 94,101
        C 88,107 75,107 54,107
        C 33,107 20,107 14,101
        C 8,95 1,82 1,54
        C 1,26 8,13 14,7
        C 20,1 33,1 54,1 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- === BACKGROUND (from ic_launcher_background.xml) === -->
    <!-- Base purple -->
    <path fill="#764ba2" d="M0,0 L108,0 L108,108 L0,108 Z"/>
    <!-- Lighter purple overlay for gradient effect -->
    <path fill="#667eea" fill-opacity="0.7" d="M0,0 L108,0 L54,108 L0,108 Z"/>

    <!-- === FOREGROUND (from ic_launcher_foreground.xml) === -->
    <!-- Back card (shadow/depth) - rotated -->
    <path fill="#FFFFFF" fill-opacity="0.3"
      d="M38,32 L74,28 Q78,27.5 79,31.5 L83,67 Q83.5,71 79.5,72 L43.5,76 Q39.5,76.5 38.5,72.5 L34.5,36.5 Q34,32.5 38,32 Z"/>

    <!-- Middle card - slightly rotated -->
    <path fill="#FFFFFF" fill-opacity="0.5"
      d="M35,30 L69,28 Q73,27.5 73.5,31.5 L75.5,65.5 Q76,69.5 72,70 L38,72 Q34,72.5 33.5,68.5 L31.5,34.5 Q31,30.5 35,30 Z"/>

    <!-- Front card - main -->
    <path fill="#FFFFFF"
      d="M32,28 L68,28 Q72,28 72,32 L72,72 Q72,76 68,76 L32,76 Q28,76 28,72 L28,32 Q28,28 32,28 Z"/>

    <!-- Card content - title line -->
    <path fill="#667eea"
      d="M35,36 L58,36 Q60,36 60,38 L60,40 Q60,42 58,42 L35,42 Q33,42 33,40 L33,38 Q33,36 35,36 Z"/>

    <!-- Card content - text lines -->
    <path fill="#CCCCCC"
      d="M35,47 L65,47 Q66,47 66,48.5 L66,50 Q66,51.5 65,51.5 L35,51.5 Q34,51.5 34,50 L34,48.5 Q34,47 35,47 Z"/>
    <path fill="#CCCCCC"
      d="M35,54 L60,54 Q61,54 61,55.5 L61,57 Q61,58.5 60,58.5 L35,58.5 Q34,58.5 34,57 L34,55.5 Q34,54 35,54 Z"/>

    <!-- Divider line -->
    <path fill="#E0E0E0"
      d="M35,63 L65,63 L65,64 L35,64 Z"/>

    <!-- Checkmark circle -->
    <circle cx="50" cy="70" r="8" fill="#667eea"/>

    <!-- Checkmark -->
    <path stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"
      d="M46,70 L49,73 L55,67"/>
  </g>
</svg>
