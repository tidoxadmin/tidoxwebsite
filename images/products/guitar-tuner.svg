<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <!-- TIDOX Guitar Tuner - Refined Icon Preview -->
  
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB300"/>
      <stop offset="35%" style="stop-color:#FF8F00"/>
      <stop offset="100%" style="stop-color:#E65100"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="108" height="108" fill="url(#bgGradient)"/>
  
  <!-- Outer glow ring -->
  <circle cx="54" cy="54" r="32" fill="white" fill-opacity="0.12"/>
  
  <!-- Sound wave arcs - left -->
  <path d="M32,50 Q28,46 32,42" stroke="white" stroke-width="2.5" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
  <path d="M27,54 Q21,46 27,38" stroke="white" stroke-width="2" stroke-opacity="0.35" fill="none" stroke-linecap="round"/>
  
  <!-- Sound wave arcs - right -->
  <path d="M76,50 Q80,46 76,42" stroke="white" stroke-width="2.5" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
  <path d="M81,54 Q87,46 81,38" stroke="white" stroke-width="2" stroke-opacity="0.35" fill="none" stroke-linecap="round"/>
  
  <!-- Tuning Fork - Left prong with rounded top -->
  <path d="M46,52 L46,27 A3,3 0 0 1 49,24 A3,3 0 0 1 52,27 L52,52 Z" fill="white"/>
  
  <!-- Tuning Fork - Right prong with rounded top -->
  <path d="M56,52 L56,27 A3,3 0 0 1 59,24 A3,3 0 0 1 62,27 L62,52 Z" fill="white"/>
  
  <!-- Handle/stem -->
  <path d="M50,52 L58,52 L58,55 L56,55 L56,78 L52,78 L52,55 L50,55 Z" fill="white"/>
  
  <!-- Ball at base -->
  <circle cx="54" cy="78" r="5" fill="white"/>
  
  <!-- Subtle shadows -->
  <path d="M50,30 L50,52 L52,52 L52,30 Z" fill="black" fill-opacity="0.06"/>
  <path d="M58,30 L58,52 L60,52 L60,30 Z" fill="black" fill-opacity="0.06"/>
  
  <!-- Highlight on ball -->
  <circle cx="52" cy="76" r="1.5" fill="white" fill-opacity="0.4"/>
</svg>
