<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="108" ry="108"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="#2D5A3D"/>
    <g transform="scale(4.7407)">
      <!-- Microphone body -->
      <path d="M43,34 L65,34 A11,11 0 0,1 65,64 L43,64 A11,11 0 0,1 43,34 Z" fill="#FFFFFF" stroke="#D0D0D0" stroke-width="1"/>
      <!-- Mic grid lines -->
      <path d="M45,38 L63,38 M45,42 L63,42 M45,46 L63,46 M45,50 L63,50 M45,54 L63,54 M45,58 L63,58" fill="none" stroke="#C0C0C0" stroke-width="0.5" stroke-linecap="round"/>
      <!-- Mic stand bracket left -->
      <path d="M43,65 Q38,71 38,77" fill="none" stroke="#E8E8E8" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Mic stand bracket right -->
      <path d="M65,65 Q70,71 70,77" fill="none" stroke="#E8E8E8" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Mic stand base -->
      <path d="M38,77 L70,77 M54,77 L54,83" fill="none" stroke="#E8E8E8" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Privacy Shield -->
      <path d="M72,39 L72,49 Q72,57 68,64 Q64,71 60,74 Q56,71 52,64 Q48,57 48,49 L48,39 L60,34 Z" fill="#D4AF37" stroke="#B8941F" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- Lock body -->
      <path d="M58,51 L66,51 L66,60 L58,60 Z" fill="#2D5A3D"/>
      <!-- Lock shackle -->
      <path d="M59,51 L59,47 Q59,44 62,44 Q65,44 65,47 L65,51" fill="none" stroke="#2D5A3D" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Lock keyhole -->
      <path d="M62,54 A1,1 0 1,1 62,56 A1,1 0 1,1 62,54" fill="#D4AF37"/>
      <!-- Sound waves left -->
      <path d="M29,49 Q26,54 29,59" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
      <path d="M24,44 Q19,54 24,64" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
