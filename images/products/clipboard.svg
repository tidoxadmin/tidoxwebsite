<?xml version="1.0" encoding="UTF-8"?>
<!-- Tidox Clipboard - Free Version Icon -->
<!-- Play Store icon: 512x512 pixels -->
<!-- Matches ic_launcher_foreground.xml + ic_launcher_background.xml from app/src/main/res -->
<!-- Edit with Inkscape: inkscape playstore/icons/sources/icon-free.svg -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   width="512"
   height="512"
   viewBox="0 0 512 512"
   version="1.1">

  <sodipodi:namedview
     inkscape:document-units="px"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:pageopacity="0"
     inkscape:pageshadow="2"
     inkscape:deskcolor="#d1d1d1" />

  <defs>
    <!-- Background gradient matching ic_launcher_background.xml -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background (Blue-to-Purple gradient) -->
  <rect width="512" height="512" fill="url(#bgGradient)"/>

  <!-- Clipboard icon scaled from 108dp adaptive icon to 512px -->
  <!-- Scale: 512/108 = 4.7407 -->
  <g transform="scale(4.7407)">
    <g transform="translate(27,22) scale(2.25)">

      <!-- Clipboard clip/handle at top -->
      <path
          d="M10,2 C10,0.9 10.9,0 12,0 C13.1,0 14,0.9 14,2 L16,2 C17.1,2 18,2.9 18,4 L18,6 L6,6 L6,4 C6,2.9 6.9,2 8,2 L10,2 Z"
          fill="#FFFFFF"
          fill-opacity="0.9"/>

      <!-- Main clipboard body -->
      <path
          d="M8,4 L8,6 L6,6 L6,22 C6,23.1 6.9,24 8,24 L16,24 C17.1,24 18,23.1 18,22 L18,6 L16,6 L16,4 C16,2.9 15.1,2 14,2 L10,2 C8.9,2 8,2.9 8,4 Z M8,8 L16,8 L16,22 L8,22 L8,8 Z"
          fill="#FFFFFF"/>

      <!-- Text lines - paper 1 -->
      <path
          d="M9,11 L15,11 L15,11.5 L9,11.5 Z"
          fill="#E0E7FF"
          fill-opacity="0.6"/>

      <!-- Text lines - paper 2 -->
      <path
          d="M9,14 L15,14 L15,14.5 L9,14.5 Z M9,16 L13,16 L13,16.5 L9,16.5 Z"
          fill="#E0E7FF"
          fill-opacity="0.6"/>

      <!-- Text lines - paper 3 -->
      <path
          d="M9,18.5 L15,18.5 L15,19 L9,19 Z M9,20 L12,20 L12,20.5 L9,20.5 Z"
          fill="#E0E7FF"
          fill-opacity="0.6"/>

    </g>
  </g>

</svg>
